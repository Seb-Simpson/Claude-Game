<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1030">
  <meta name="description" content="Snowline: a procedural 2.5D mountain-climbing game about the decision to keep going or turn back.">
  <title>Snowline</title>
  <link rel="icon" href="assets/sprites/flag.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage" aria-label="Snowline">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui" role="application"></div>
    <div id="touch" aria-hidden="true"></div>
    <div id="captions" aria-live="polite"></div>
    <canvas id="fx" width="480" height="270" aria-hidden="true"></canvas>
    <div id="loading"><div class="load-title">SNOWLINE</div><div class="load-bar"><span></span></div></div>
  </div>
  <div id="rotate">Turn your phone sideways for the full view.</div>
  <noscript><p class="noscript">Snowline needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
